<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF3300"/>
    </linearGradient>
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5500" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="240" fill="#0C0C0E" stroke="url(#ring-grad)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FF5500" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Background inner glow -->
  <circle cx="250" cy="250" r="220" fill="url(#bg-glow)"/>

  <!-- Top Burger Outline Accent -->
  <path d="M 120 120 Q 250 40 380 120" fill="none" stroke="#FF5500" stroke-width="8" stroke-linecap="round"/>
  <circle cx="190" cy="85" r="4" fill="#FFB800"/>
  <circle cx="250" cy="75" r="5" fill="#FFB800"/>
  <circle cx="310" cy="85" r="4" fill="#FFB800"/>

  <!-- Fries Mascot Silhouette Right side -->
  <g transform="translate(320, 110) scale(0.65)">
    <!-- Fries container -->
    <path d="M 20 60 L 100 60 L 85 150 L 35 150 Z" fill="#E60000" stroke="#FFB800" stroke-width="4"/>
    <!-- French Fries -->
    <rect x="25" y="10" width="12" height="60" rx="3" fill="#FFC700" stroke="#CC9900" stroke-width="2"/>
    <rect x="42" y="-5" width="14" height="75" rx="3" fill="#FFD700" stroke="#CC9900" stroke-width="2"/>
    <rect x="60" y="5" width="13" height="65" rx="3" fill="#FFC700" stroke="#CC9900" stroke-width="2"/>
    <rect x="76" y="20" width="12" height="50" rx="3" fill="#FFD700" stroke="#CC9900" stroke-width="2"/>
    <!-- Sunglasses -->
    <path d="M 30 90 Q 55 90 55 105 Q 30 105 30 90 Z M 65 90 Q 90 90 90 105 Q 65 105 65 90 Z" fill="#000" stroke="#FFF" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 40 120 Q 60 135 80 120" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Thumbs up -->
    <circle cx="15" cy="115" r="10" fill="#FFF"/>
  </g>

  <!-- MAIN TITLE: MORO'S -->
  <g transform="translate(240, 225)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="#FF5500" text-anchor="middle" stroke="#000" stroke-width="12" paint-order="stroke fill">MORO'S</text>
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="url(#text-gold)" text-anchor="middle">MORO'S</text>
  </g>

  <!-- SUBTITLE: Comidas Rápidas -->
  <g transform="translate(250, 290)">
    <text x="0" y="0" font-family="'Brush Script MT', 'Pacifico', cursive, sans-serif" font-size="44" font-style="italic" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">Comidas rápidas</text>
  </g>

  <!-- Bottom Burger Arc Accent -->
  <path d="M 80 340 Q 250 440 420 340" fill="none" stroke="#FF5500" stroke-width="6" stroke-linecap="round"/>

  <!-- Phone Badges at Bottom -->
  <g transform="translate(250, 395)">
    <!-- WhatsApp icon silhouette -->
    <circle cx="-130" cy="-5" r="14" fill="#25D366"/>
    <text x="-130" y="0" font-family="sans-serif" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold">W</text>
    
    <text x="-105" y="0" font-family="'Arial', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">0985090704</text>
    <text x="-105" y="22" font-family="'Arial', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">0961290493</text>
  </g>

  <!-- Location Pin Icon Left -->
  <g transform="translate(110, 390)">
    <circle cx="0" cy="0" r="18" fill="#FF5500"/>
    <path d="M -6 -4 L 0 -12 L 6 -4 C 6 4 0 8 0 8 C 0 8 -6 4 -6 -4 Z" fill="#FFF"/>
  </g>
</svg>
